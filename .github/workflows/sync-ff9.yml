
name: Sync FFIX Achievements

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch FFIX achievements
        run: |
          curl --fail --silent --show-error --location \
            --retry 3 \
            "https://gentle-dream-1c3a.zibilimek.workers.dev/ff9" \
            -o ff9-progress.json

          jq -e '.Achievements | type == "object"' ff9-progress.json > /dev/null

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ff9-progress.json
          if ! git diff --cached --quiet; then
            git commit -m "Update FFIX achievements"
            git push
          fi
